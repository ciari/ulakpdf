user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

# Dynamic modules built into the image. Absolute paths because `load_module`
# resolves relative paths against --prefix (/etc/nginx), not --modules-path.
load_module /usr/lib/nginx/modules/ngx_http_shibboleth_module.so;
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Stirling-PDF accepts large uploads (default cap 100 MB; raise if you bump SYSTEM_MAXFILESIZE).
    client_max_body_size 200m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Strip any incoming Shib-* / REMOTE_USER headers so a client cannot spoof
    # an authenticated identity. Trusted values are reinjected from shibauthorizer.
    map $http_authorization $clear_remote_user { default ""; }

    # Public port the user reached us on, derived from the Host header. This is
    # what Stirling needs in X-Forwarded-Port to compute its OAuth2 redirect_uri
    # — $server_port would give the in-container 80, which is wrong.
    map $http_host $public_port {
        default                              "$server_port";
        "~^[^:]+:(?<extracted_port>\d+)$"    $extracted_port;
    }

    # Quick "is the user logged in?" check by sniffing the Shibboleth SP's
    # session cookie. We use this only to decide whether to serve the public
    # landing page or BentoPDF on `/`. Real auth still happens via shib_request.
    map $http_cookie $has_shib_session {
        default              0;
        "~_shibsession_"     1;
    }

    # KVKK consent cookie sniff. The cookie value carries the policy version
    # the user accepted (e.g. spdf-consent=v1). Bumping the version in
    # stats-api forces re-consent because this regex requires the exact match.
    map $http_cookie $has_consent {
        default              0;
        "~spdf-consent=v2"   1;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ----- Real client IP recovery -----
    # Host nginx terminates TLS and proxies to us at 127.0.0.1:8081, so
    # without this block every $remote_addr would be 127.0.0.1 or a docker
    # bridge IP (e.g. 172.18.0.1) — useless in access logs, stats and the
    # shibd transaction log.
    #
    # We trust X-Forwarded-For from the host loopback and the docker bridge
    # range; real_ip_recursive walks leftward through any chained proxies,
    # stopping at the first untrusted hop (the real client).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    log_format  shib  '$remote_addr - "$upstream_http_variable_remote_user" [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    # JSON line format consumed by stats-api. The $shib_* vars only get a value
    # in locations that include shib-protect.snippet (which sets them via
    # shib_request_set); for /Shibboleth.sso/* and other unprotected locations
    # they come out as empty strings, which the parser treats as "no user".
    log_format stats escape=json
        '{"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"eppn":"$shib_eppn",'
        '"mail":"$shib_mail",'
        '"affil":"$shib_affiliation",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"ua":"$http_user_agent"}';

    # Default access_log catches everything (Shib endpoints, errors, etc.).
    # The stats access_log is opted-in inside shib-protect.snippet, so the
    # stats.log file only contains entries that have valid $shib_* values.
    #
    # We also tee access logs to /dev/stdout so Docker's syslog logging
    # driver (configured in docker-compose.prod.yml) ships them to
    # loghost.ulakbim.gov.tr:514. The file is kept because stats-api
    # tails it and logrotate manages on-disk retention.
    access_log /var/log/nginx/access.log shib;
    access_log /dev/stdout              shib;
    error_log  /var/log/nginx/error.log warn;
    error_log  /dev/stderr              warn;

    include /etc/nginx/conf.d/*.conf;
}
