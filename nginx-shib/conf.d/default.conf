# UlakPDF — BentoPDF behind Shibboleth, with a public landing page so the
# service identity is visible to anonymous visitors.
#
# Layout:
#   /landing              → public custom landing HTML
#   /landing-assets/*     → public assets used by the landing
#   /                     → redirect to /landing for anonymous, BentoPDF for
#                           authenticated visitors
#   everything else       → Shibboleth-gated (BentoPDF assets, tool pages,
#                           stats dashboard, etc.) — anonymous direct access
#                           triggers a SAML round-trip
#   /Shibboleth.sso/*     → SP handlers (always public; required for the SAML
#                           handshake to work)
#   /logout               → terminates the SP session and returns to /landing

server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Emit relative Location headers; the browser fills in scheme/host/port
    # from its current address. Avoids leaking the in-container :80 in 302s.
    absolute_redirect off;

    # ----- Shibboleth SP endpoints (must stay public) -----
    location /Shibboleth.sso {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/shibboleth/shibresponder.sock;
        fastcgi_param SCRIPT_FILENAME shibresponder;
    }
    location = /shibauthorizer {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/shibboleth/shibauthorizer.sock;
        fastcgi_param SCRIPT_FILENAME shibauthorizer;
        access_log /var/log/nginx/shibauth.log shib;
    }

    # ----- Public landing page -----
    location = /landing {
        alias /etc/nginx/landing/;
        try_files /index.html =404;
    }
    location /landing-assets/ {
        alias /etc/nginx/landing/;
        try_files $uri =404;
    }

    # ----- Public documentation (mkdocs-material) -----
    # Anonymous visitors can read the docs without logging in. The trailing
    # slash on both sides strips the /docs/ prefix when proxying.
    location /docs/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $docs_upstream docs:80;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$docs_upstream;
    }
    # Trailing slash convenience: /docs → /docs/
    location = /docs {
        return 302 /docs/;
    }

    # ----- /logout: end the SP session, bounce back to /landing -----
    location = /logout {
        return 302 /Shibboleth.sso/Logout?return=/landing;
    }

    # ----- Stats dashboard + API (admin-gated inside stats-api) -----
    location /stats/api/ {
        include conf.d/shib-protect.snippet;
        set $stats_upstream stats-api:8000;
        rewrite ^/stats/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$stats_upstream;
    }
    location /stats/ {
        include conf.d/shib-protect.snippet;
        alias /etc/nginx/stats-admin/;
        index index.html;
    }

    # ----- Homepage: anonymous → landing, authenticated → BentoPDF -----
    # Cookie sniff is only a UX hint; if the cookie is stale, the gated
    # BentoPDF location below still triggers a fresh SAML round-trip.
    location = / {
        if ($has_shib_session = 0) {
            return 302 /landing;
        }
        include conf.d/shib-protect.snippet;
        set $bentopdf_upstream bentopdf:8080;
        # Tell JS who's logged in (non-HttpOnly so the navbar can read it).
        # Path=/ keeps the cookie present on every page; SameSite=Lax avoids
        # cross-site leaks. Updated on every request so a Shib re-login
        # produces a fresh value.
        add_header Set-Cookie "spdf-user=$shib_eppn; Path=/; SameSite=Lax" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$bentopdf_upstream;
    }

    # ----- Everything else: Shibboleth-gated proxy to BentoPDF -----
    # This includes tool pages (/pdf-*), other content pages (/about, /faq,
    # /tools), and ALL static assets. Gating assets too keeps anonymous
    # visitors completely off the app — the landing page is the only thing
    # they see.
    location / {
        include conf.d/shib-protect.snippet;
        set $bentopdf_upstream bentopdf:8080;
        add_header Set-Cookie "spdf-user=$shib_eppn; Path=/; SameSite=Lax" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$bentopdf_upstream;
    }
}
