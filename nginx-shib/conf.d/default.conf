# UlakPDF — BentoPDF behind Shibboleth + KVKK consent gate.
#
# Layout:
#   /landing              → public custom landing HTML
#   /landing-assets/*     → public assets used by the landing
#   /docs/                → public mkdocs documentation
#   /Shibboleth.sso/*     → SP handlers (always public; required for SAML)
#
#   /consent/             → KVKK consent page (Shib-gated, NOT consent-gated)
#   /api/consent          → POST endpoint to record consent (same gating as above)
#   /api/consent/status   → GET endpoint for status (same gating)
#
#   /                     → anon → /landing
#                           logged-in + no consent → /consent/
#                           logged-in + consent → BentoPDF
#   everything else       → Shib-gated + consent-gated → BentoPDF
#
# Why a "user accepts KVKK first" gate: per Turkish data protection law,
# we want explicit, recorded consent before processing the user's mail and
# affiliation. The cookie sniff is the fast path; the actual record lives
# in stats-api's consents table.

server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    # ----- Shibboleth SP endpoints (must stay public) -----
    location /Shibboleth.sso {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/shibboleth/shibresponder.sock;
        fastcgi_param SCRIPT_FILENAME shibresponder;
    }
    location = /shibauthorizer {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/shibboleth/shibauthorizer.sock;
        fastcgi_param SCRIPT_FILENAME shibauthorizer;
        access_log /var/log/nginx/shibauth.log shib;
    }

    # ----- Public landing -----
    location = /landing {
        alias /etc/nginx/landing/;
        try_files /index.html =404;
    }
    location /landing-assets/ {
        alias /etc/nginx/landing/;
        try_files $uri =404;
    }

    # ----- Public documentation -----
    location /docs/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $docs_upstream docs:80;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$docs_upstream;
    }
    location = /docs {
        return 302 /docs/;
    }

    # ----- /logout: end the SP session, bounce to /landing -----
    location = /logout {
        return 302 /Shibboleth.sso/Logout?return=/landing;
    }

    # ----- KVKK consent page (Shib-gated, NOT consent-gated to avoid loop) -----
    location /consent/ {
        include conf.d/shib-protect.snippet;
        alias /etc/nginx/consent/;
        index index.html;
    }
    location = /consent {
        return 302 /consent/;
    }

    # POST endpoint for recording consent (and status check).
    # Both Shib-gated; not consent-gated (otherwise the user could never
    # accept). nginx forwards X-Remote-User / X-Remote-Mail / X-Remote-Affil
    # via the shib snippet so stats-api can identify the accepting user.
    location = /api/consent {
        include conf.d/shib-protect.snippet;
        set $stats_upstream stats-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$stats_upstream;
    }
    location = /api/consent/status {
        include conf.d/shib-protect.snippet;
        set $stats_upstream stats-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$stats_upstream;
    }

    # ----- Stats dashboard + API (admin-gated inside stats-api) -----
    # Also consent-gated: even admins must accept KVKK first.
    location /stats/api/ {
        if ($has_consent = 0) { return 302 /consent/; }
        include conf.d/shib-protect.snippet;
        set $stats_upstream stats-api:8000;
        rewrite ^/stats/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$stats_upstream;
    }
    location /stats/ {
        if ($has_consent = 0) { return 302 /consent/; }
        include conf.d/shib-protect.snippet;
        alias /etc/nginx/stats-admin/;
        index index.html;
    }

    # ----- Homepage: anon → landing, logged-in no-consent → consent, else BentoPDF -----
    location = / {
        if ($has_shib_session = 0) { return 302 /landing; }
        if ($has_consent = 0)      { return 302 /consent/; }
        include conf.d/shib-protect.snippet;
        set $bentopdf_upstream bentopdf:8080;
        add_header Set-Cookie "spdf-user=$shib_eppn; Path=/; SameSite=Lax" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$bentopdf_upstream;
    }

    # ----- Everything else: Shib + consent gated, proxies to BentoPDF -----
    location / {
        if ($has_consent = 0) { return 302 /consent/; }
        include conf.d/shib-protect.snippet;
        set $bentopdf_upstream bentopdf:8080;
        add_header Set-Cookie "spdf-user=$shib_eppn; Path=/; SameSite=Lax" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://$bentopdf_upstream;
    }
}
