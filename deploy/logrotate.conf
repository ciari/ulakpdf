# Rotate the nginx logs inside the docker named volume `ulakpdf_nginx-logs`.
# Path is the on-host location of the volume's _data directory.
/var/lib/docker/volumes/ulakpdf_nginx-logs/_data/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    sharedscripts
    postrotate
        # Tell nginx to reopen its log files inside the container.
        docker exec ulakpdf-nginx-shib nginx -s reopen 2>/dev/null || true
    endscript
}

# Host nginx logs — Debian's nginx package already ships its own
# /etc/logrotate.d/nginx, so we don't duplicate that here.
