# UlakPDF → ULAKBİM loghost forwarder (rsyslog drop-in).
#
# Install:
#   sudo install -m 0644 deploy/rsyslog/ulakpdf.conf /etc/rsyslog.d/30-ulakpdf.conf
#   sudo systemctl restart rsyslog
#
# What it does:
#   - Tails the two log files that matter for security/audit:
#       /var/lib/docker/volumes/ulakpdf_nginx-logs/_data/stats.log
#         → JSON-per-line, one record per Shibboleth-authenticated HTTP
#           request (eppn, mail, affiliation, IP, URI, status, ua)
#       /var/lib/docker/volumes/ulakpdf_shib-logs/_data/transaction.log
#         → shibd's pipe-delimited audit log (Login / Logout / AuthnRequest
#           events with session id, IdP entity, etc.)
#   - Tags messages so the receiver can filter:
#       ulakpdf.stats        (JSON access events)
#       ulakpdf.shib-trans   (shibd transactions)
#   - Forwards to loghost.ulakbim.gov.tr:514 over UDP. Switch the
#     `protocol="udp"` line below to `"tcp"` for guaranteed delivery
#     (recommended for security/audit logs; uses port 514 over TCP).
#   - Keeps a local copy at /var/log/ulakpdf/ on this host (separate
#     files per source, daily rotation via host logrotate).

# ----- 1. Load the file-tailing module (cheap, one-time) -----
module(load="imfile" pollingInterval="5")

# ----- 2. Sources -----
input(type="imfile"
      File="/var/lib/docker/volumes/ulakpdf_nginx-logs/_data/stats.log"
      Tag="ulakpdf.stats"
      Severity="info"
      Facility="local6"
      ruleset="ulakpdf_ship")

input(type="imfile"
      File="/var/lib/docker/volumes/ulakpdf_shib-logs/_data/transaction.log"
      Tag="ulakpdf.shib-trans"
      Severity="info"
      Facility="local6"
      ruleset="ulakpdf_ship")

# ----- 3. Local copy template (so we can keep a side-by-side archive) -----
template(name="UlakPdfLocalFile" type="string"
         string="/var/log/ulakpdf/%programname%.log")

# Plain message-only format on disk — the JSON / pipe payload is enough.
template(name="UlakPdfMsg" type="string" string="%msg:2:$%\n")

# ----- 4. Ruleset: forward + local copy, no fallthrough to /var/log/syslog -----
ruleset(name="ulakpdf_ship") {
    # Local archive (handy when loghost is unreachable; also for grep).
    action(type="omfile"
           dynaFile="UlakPdfLocalFile"
           template="UlakPdfMsg"
           createDirs="on"
           fileCreateMode="0640"
           dirCreateMode="0750"
           fileOwner="syslog"
           fileGroup="adm")

    # Remote forward. Switch to "tcp" for guaranteed delivery.
    action(type="omfwd"
           target="loghost.ulakbim.gov.tr"
           port="514"
           protocol="udp"
           template="RSYSLOG_SyslogProtocol23Format"
           action.resumeRetryCount="-1"
           queue.type="LinkedList"
           queue.size="10000"
           queue.saveOnShutdown="on"
           queue.dequeueBatchSize="100"
           action.resumeInterval="30")

    # Don't fall through to the default ruleset (which would dupe these
    # entries into /var/log/syslog).
    stop
}
