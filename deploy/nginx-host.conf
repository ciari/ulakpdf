# Host nginx TLS terminator for UlakPDF.
# Path: /etc/nginx/sites-available/ulakpdf
#
# Replace ${DOMAIN} below with your real hostname before symlinking into
# /etc/nginx/sites-enabled/. The certbot --nginx plugin will then add the
# `listen 443 ssl` block and the ssl_certificate lines automatically.
#
# Layout:
#   :80  → redirect everything to https://${DOMAIN}, EXCEPT ACME challenges
#   :443 → TLS-terminate, proxy to the docker stack on 127.0.0.1:8081

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # certbot HTTP-01 challenge — keep this BEFORE the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # certbot --nginx will inject the lines below on first issue:
    #   ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reasonable TLS knobs — certbot's options-ssl-nginx.conf sets most of
    # this, but keep these as defaults so the config is safe pre-cert too.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — only enable AFTER you've confirmed everything works end-to-end.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Don't leak the nginx version in error pages.
    server_tokens off;

    # Large request body: BentoPDF processes locally, but tool-pages still
    # POST occasional small payloads (e.g. translations, telemetry-style
    # POSTs from JS). Keep some headroom anyway.
    client_max_body_size 200m;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # ----- Pass everything down to the docker stack -----
    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Connection            "";
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     https;
        proxy_set_header X-Forwarded-Host      $host;
        proxy_set_header X-Forwarded-Port      443;

        # Stream both ways — needed for large WASM bundle downloads.
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # Basic access log path. logrotate handles rotation (see deploy/logrotate.conf).
    access_log /var/log/nginx/ulakpdf.access.log;
    error_log  /var/log/nginx/ulakpdf.error.log warn;
}
