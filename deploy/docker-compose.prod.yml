# Production compose file — standalone, used INSTEAD of the dev docker-compose.yml.
#
# Differences from the dev compose:
#   - No test-idp (uses real Yetkim IdP)
#   - Port bound to 127.0.0.1 only (host nginx fronts TLS)
#   - No bind-mount of idp-config (real IdP has its own config)
#   - Adds restart: always for resilience
#   - Healthchecks tightened for monitoring
#
# Remote logging is handled by host rsyslog (see deploy/rsyslog/ulakpdf.conf),
# which tails stats.log and shibd's transaction.log directly from named
# volumes and forwards to loghost.ulakbim.gov.tr. Containers themselves use
# Docker's default json-file driver so `docker logs <container>` keeps
# working for ad-hoc debugging.
#
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build

name: ulakpdf

services:
  bentopdf:
    build:
      context: ../bentopdf
      args:
        SIMPLE_MODE: "true"
        VITE_BRAND_NAME: "${VITE_BRAND_NAME:-UlakPDF}"
        VITE_FOOTER_TEXT: "${VITE_FOOTER_TEXT:-}"
        VITE_BRAND_LOGO: "${VITE_BRAND_LOGO:-images/ulakpdf-logo.png}"
    image: ulakpdf-bentopdf:branded
    restart: always
    deploy:
      replicas: ${BENTOPDF_REPLICAS:-3}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ulakpdf

  docs:
    build:
      context: ../docs-site
    image: ulakpdf-docs
    container_name: ulakpdf-docs
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ulakpdf

  stats-api:
    build:
      context: ../stats-api
    image: ulakpdf-stats-api
    container_name: ulakpdf-stats-api
    restart: always
    expose:
      - "8000"
    environment:
      ADMIN_EPPNS: "${ADMIN_EPPNS}"
    volumes:
      - nginx-logs:/logs:ro
      - stats-db:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/healthz\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ulakpdf

  nginx-shib:
    build:
      context: ../nginx-shib
    image: ulakpdf-nginx-shib
    container_name: ulakpdf-nginx-shib
    restart: always
    depends_on:
      bentopdf:
        condition: service_healthy
      stats-api:
        condition: service_healthy
    # Bind to loopback only — host nginx (TLS terminator) reaches it via
    # 127.0.0.1:8081, the public internet does not.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    environment:
      SP_HOSTNAME: "${SP_HOSTNAME}"
      SP_ENTITY_ID: "${SP_ENTITY_ID}"
      SP_BASE_URL: "${SP_BASE_URL}"
      IDP_ENTITY_ID: "${IDP_ENTITY_ID:-}"
      IDP_METADATA_URL: "${IDP_METADATA_URL}"
      # Set to your federation's Discovery Service URL to switch to federation
      # mode (Yetkim WAYF). Leave empty to pin to a single IDP_ENTITY_ID.
      IDP_DISCOVERY_URL: "${IDP_DISCOVERY_URL:-}"
      SUPPORT_CONTACT: "${SUPPORT_CONTACT}"
      # Don't block startup waiting for the IdP — production IdP is always up,
      # and a slow remote check would delay our container boot during incidents.
      WAIT_FOR_IDP: "0"
    volumes:
      - shib-state:/etc/shibboleth
      - nginx-logs:/var/log/nginx
      # Persistent shibd logs (transaction.log, shibd.log) so host rsyslog
      # can tail them and they survive container recreate.
      - shib-logs:/var/log/shibboleth
      - ../stats-admin:/etc/nginx/stats-admin:ro
      - ../landing:/etc/nginx/landing:ro
      - ../consent:/etc/nginx/consent:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost/Shibboleth.sso/Metadata | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ulakpdf

networks:
  ulakpdf:
    driver: bridge

volumes:
  shib-state:
  shib-logs:
  nginx-logs:
  stats-db:
